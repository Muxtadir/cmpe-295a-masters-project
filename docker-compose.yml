services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
      POSTGRES_DB: retail_ops
    ports:
      - "5432:5432"
    volumes:
      - retail_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail_ops"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://retail:retail@db:5432/retail_ops
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  retail_pg_data:
